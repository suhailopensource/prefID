name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "${{ matrix.node-version }}"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run typecheck:package

      # Smoke-test the built package on every modern Node version, ESM + CJS.
      - run: npm run smoke

  legacy-node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["14.18", "16"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "${{ matrix.node-version }}"
      - name: Smoke (ESM + CJS)
        run: node scripts/smoke.mjs && node scripts/smoke.cjs

  # Nothing checked the published shape of the package until now, which is how a
  # packaging bug reached npm. `files: ["dist"]` plus the conditional `exports`
  # map is the most fragile part of a dual ESM/CJS package: it is only exercised
  # by installing the tarball, so every other job here can be green while the
  # thing users download is wrong.
  #
  # Both tools run against `npm pack` output, not the working tree, so they see
  # what npm would actually publish.
  #
  # Majors are pinned. An unpinned `npx` gate turns an unrelated tool release
  # into a red PR, and a gate that goes red for reasons the author cannot act on
  # is one people learn to ignore. Pinning the major still takes fixes.
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      # Exports map, file inclusion, module/type mismatches.
      #
      # --strict because publint exits 0 on warnings. Without it this step would
      # print a real packaging fault and still go green, which is worse than not
      # having the step: the report exists and nobody is told to act on it.
      - name: publint
        run: npx --yes publint@0.3 --strict

      # Whether the types actually resolve from CJS, ESM, node10 and bundlers.
      - name: Are the types wrong?
        run: npx --yes @arethetypeswrong/cli@0.18 --pack

  runtimes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Bun
        run: bun scripts/smoke.mjs

      - uses: denoland/setup-deno@61fe2df320078202e33d7d5ad347e7dcfa0e8f31 # v1.1.2
        with:
          deno-version: v2.x
      - name: Deno
        run: deno run --allow-read scripts/smoke.mjs
